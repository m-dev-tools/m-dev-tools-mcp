name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: make install
        # Bootstraps .venv, pulls the MCP SDK + dev deps. Same shape as
        # the local-dev path so a contributor's `make install` and CI's
        # behavior do not diverge.
        run: make install

      - name: make check
        # lint + mypy + test + check-manifest + check-agents.
        # The drift gates (check-manifest, check-agents) are the
        # cross-repo Phase-0 contract — same shape that every tier-1 /
        # tier-2 / tier-3 m-dev-tools repo ships.
        run: make check
